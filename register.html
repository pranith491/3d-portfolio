<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Register | Pranith Portfolio</title><link rel="stylesheet" href="css/style.css"><script src="js/app.js" defer></script></head>
<body class="auth-page"><a class="back-home" href="index.html">← Back to portfolio</a><div class="auth-orb"></div><main class="auth-card"><div class="auth-avatar"><img src="assets/pranith-photo.jpg" alt="Pranith Kumar"></div><p class="eyebrow">JOIN THE COMMUNITY</p><h1>Create <span class="gold">account.</span></h1><p class="muted">Demo registration form.</p><form id="registerForm"><label>Full name<input name="name" required maxlength="80" placeholder="Your name"></label><label>Email<input type="email" name="email" required placeholder="you@example.com"></label><label>Password<input type="password" name="password" required minlength="6" placeholder="At least 6 characters"></label><button class="button button-gold full-width" type="submit">Create account ↗</button><p id="registerStatus" class="form-status" role="status"></p></form><p class="auth-note">Demo only: do not use a real password. Secure account storage needs a backend.</p></main></body></html>
